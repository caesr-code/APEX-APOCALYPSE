const TextureGen = {
  createNoiseCanvas(w, h, op) {
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');
    const img = ctx.createImageData(w, h);
    for (let i = 0; i < img.data.length; i += 4) {
      const v = Math.floor(Math.random() * 255);
      img.data[i] = v; img.data[i+1] = v; img.data[i+2] = v; img.data[i+3] = Math.floor(op * 255);
    }
    ctx.putImageData(img, 0, 0);
    return canvas;
  },
  groundTerrain() {
    const c = document.createElement('canvas');
    c.width = 1024; c.height = 1024;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#221c16';
    ctx.fillRect(0, 0, 1024, 1024);
    ctx.fillStyle = '#171410';
    ctx.fillRect(400, 0, 224, 1024);
    ctx.fillRect(0, 400, 1024, 224);
    for(let i=0; i<200; i++) {
      ctx.fillStyle = i % 2 === 0 ? '#14100c' : '#332a21';
      ctx.beginPath();
      ctx.arc(Math.random()*1024, Math.random()*1024, 15 + Math.random()*85, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 0.3;
    ctx.drawImage(this.createNoiseCanvas(1024, 1024, 1), 0, 0);
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    return tex;
  },
  rock() {
    const c = document.createElement('canvas');
    c.width = 512; c.height = 512;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#3a3a3c';
    ctx.fillRect(0, 0, 512, 512);
    ctx.strokeStyle = '#232325';
    ctx.lineWidth = 4;
    for(let i=0; i<30; i++) {
      ctx.beginPath();
      let x = Math.random()*512, y = Math.random()*512;
      ctx.moveTo(x, y);
      for(let j=0; j<4; j++) {
        x += (Math.random()-0.5)*120;
        y += (Math.random()-0.5)*120;
        ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 0.25;
    ctx.drawImage(this.createNoiseCanvas(512, 512, 1), 0, 0);
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    return tex;
  },
  damagedConcrete() {
    const c = document.createElement('canvas');
    c.width = 512; c.height = 512;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#4a4d52';
    ctx.fillRect(0, 0, 512, 512);
    ctx.strokeStyle = '#1e2022';
    ctx.lineWidth = 3;
    for(let i=0; i<18; i++) {
      ctx.beginPath();
      let x = Math.random()*512, y = Math.random()*512;
      ctx.moveTo(x, y);
      for(let j=0; j<6; j++) {
        x += (Math.random()-0.5)*80;
        y += (Math.random()-0.5)*80;
        ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    ctx.fillStyle = '#1c1d1f';
    for(let i=0; i<15; i++) {
      ctx.beginPath();
      ctx.arc(Math.random()*512, Math.random()*512, 10 + Math.random()*35, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 0.3;
    ctx.drawImage(this.createNoiseCanvas(512, 512, 1), 0, 0);
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    return tex;
  },
  brickRuin() {
    const c = document.createElement('canvas');
    c.width = 512; c.height = 512;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#5c231d';
    ctx.fillRect(0, 0, 512, 512);
    ctx.strokeStyle = '#211d1c';
    ctx.lineWidth = 4;
    const rows = 16;
    const rH = 512 / rows;
    for(let i=0; i<=rows; i++) {
      ctx.beginPath(); ctx.moveTo(0, i*rH); ctx.lineTo(512, i*rH); ctx.stroke();
    }
    for(let i=0; i<rows; i++) {
      const off = (i % 2) * 32;
      for(let j=0; j<512; j+=64) {
        ctx.beginPath(); ctx.moveTo(j + off, i*rH); ctx.lineTo(j + off, (i+1)*rH); ctx.stroke();
      }
    }
    ctx.globalAlpha = 0.25;
    ctx.drawImage(this.createNoiseCanvas(512, 512, 1), 0, 0);
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    return tex;
  },
  metalRusted() {
    const c = document.createElement('canvas');
    c.width = 256; c.height = 256;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#2d2f32';
    ctx.fillRect(0, 0, 256, 256);
    ctx.fillStyle = '#592911';
    for(let i=0; i<25; i++) {
      ctx.beginPath();
      ctx.arc(Math.random()*256, Math.random()*256, 8 + Math.random()*20, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 0.25;
    ctx.drawImage(this.createNoiseCanvas(256, 256, 1), 0, 0);
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    return tex;
  },
  sandbag() {
    const c = document.createElement('canvas');
    c.width = 256; c.height = 256;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#7a603c';
    ctx.fillRect(0, 0, 256, 256);
    ctx.strokeStyle = '#47361f';
    ctx.lineWidth = 8;
    ctx.strokeRect(0, 0, 256, 256);
    ctx.globalAlpha = 0.3;
    ctx.drawImage(this.createNoiseCanvas(256, 256, 1), 0, 0);
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    return tex;
  }
};

function getGroundHeight(x, z) {
  const distFromCenter = Math.hypot(x, z);
  let height = Math.sin(x * 0.03) * Math.cos(z * 0.03) * 3.2;
  if (distFromCenter > 110) {
    height += Math.pow((distFromCenter - 110) * 0.12, 1.35);
  }
  return height;
}

function findFreeSpot(colliders, rMin, rMax, tries = 250) {
  for (let i = 0; i < tries; i++) {
    const a = Math.random() * Math.PI * 2, r = rMin + Math.random() * (rMax - rMin);
    const x = Math.cos(a) * r, z = Math.sin(a) * r, y = getGroundHeight(x, z);
    const box = new THREE.Box3().setFromCenterAndSize(new THREE.Vector3(x, y + 1, z), new THREE.Vector3(1.6, 2.2, 1.6));
    if (!colliders.some(c => c.intersectsBox(box))) return { x, y, z };
  }
  return { x: 0, y: getGroundHeight(0, 0), z: 0 };
}


const MAP_SEED = 0xA93F27D1;
function seededRandom(seed){let a=seed>>>0;return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return ((t^(t>>>14))>>>0)/4294967296;};}
function withSeed(seed,fn){const old=Math.random;Math.random=seededRandom(seed);try{return fn();}finally{Math.random=old;}}

function buildArena(scene) {
  scene.background = new THREE.Color(0x615041);
  scene.fog = new THREE.FogExp2(0x615041, 0.0065);

  const ambientLight = new THREE.AmbientLight(0xb5a085, 0.85);
  scene.add(ambientLight);
  const sun = new THREE.DirectionalLight(0xffe2b3, 1.95);
  sun.position.set(160, 180, 80);
  sun.castShadow = true;
  sun.shadow.mapSize.width = IS_MOBILE ? 512 : 1024;
  sun.shadow.mapSize.height = IS_MOBILE ? 512 : 1024;
  sun.shadow.camera.near = 0.5;
  sun.shadow.camera.far = IS_MOBILE ? 200 : 320;
  sun.shadow.autoUpdate = true;
  const shd = IS_MOBILE ? 95 : 150;
  sun.shadow.camera.left = -shd; sun.shadow.camera.right = shd;
  sun.shadow.camera.top = shd; sun.shadow.camera.bottom = -shd;
  scene.add(sun);

  const texGround = TextureGen.groundTerrain(); texGround.repeat.set(22, 22);
  const texRock = TextureGen.rock(); texRock.repeat.set(3, 3);
  const texConcrete = TextureGen.damagedConcrete(); texConcrete.repeat.set(3, 3);
  const texBrick = TextureGen.brickRuin(); texBrick.repeat.set(3, 3);
  const texMetalRusted = TextureGen.metalRusted(); texMetalRusted.repeat.set(2, 2);
  const texSandbag = TextureGen.sandbag(); texSandbag.repeat.set(2, 1);

  const matGround = new THREE.MeshStandardMaterial({ map: texGround, roughness: 0.95, metalness: 0.05 });
  const matRock = new THREE.MeshStandardMaterial({ map: texRock, roughness: 0.9, metalness: 0.1 });
  const matConcrete = new THREE.MeshStandardMaterial({ map: texConcrete, roughness: 0.8, metalness: 0.1 });
  const matBrick = new THREE.MeshStandardMaterial({ map: texBrick, roughness: 0.85, metalness: 0.05 });
  const matMetalRusted = new THREE.MeshStandardMaterial({ map: texMetalRusted, roughness: 0.6, metalness: 0.5 });
  const matSandbag = new THREE.MeshStandardMaterial({ map: texSandbag, roughness: 0.9, metalness: 0.0 });

  const colliders = [];
  const worldMeshes = [];
  const _mergeGroups = new Map();
  function _queueMerge(geometry, matrixWorld, mat, castsShadow, receiveShadow) {
    const key = mat.uuid + '_' + (castsShadow ? 1 : 0) + '_' + (receiveShadow ? 1 : 0);
    let g = _mergeGroups.get(key);
    if (!g) { g = { mat, castsShadow, receiveShadow, geos: [] }; _mergeGroups.set(key, g); }
    const geo = geometry.clone();
    geo.applyMatrix4(matrixWorld);
    g.geos.push(geo);
  }
  function flushStaticMerges() {
    for (const { mat, castsShadow, receiveShadow, geos } of _mergeGroups.values()) {
      if (!geos.length) continue;
      const merged = BufferGeometryUtils.mergeGeometries(geos, false);
      const mesh = new THREE.Mesh(merged, mat);
      mesh.castShadow = castsShadow;
      mesh.receiveShadow = receiveShadow;
      mesh.matrixAutoUpdate = false;
      mesh.updateMatrix();
      scene.add(mesh);
      worldMeshes.push(mesh);
      for (const geo of geos) geo.dispose();
    }
    _mergeGroups.clear();
  }
  const _tmpMesh = new THREE.Object3D();
  function registerCollider(geometry, matrixWorld) {
    geometry.computeBoundingBox();
    const box = new THREE.Box3();
    box.copy(geometry.boundingBox).applyMatrix4(matrixWorld);
    colliders.push(box);
    return box;
  }
  function createBox(w, h, d, x, y, z, mat, rotY = 0, rotX = 0, rotZ = 0, castsShadow = true) {
    const geo = new THREE.BoxGeometry(w, h, d);
    _tmpMesh.position.set(x, y, z);
    _tmpMesh.rotation.set(rotX, rotY, rotZ);
    _tmpMesh.scale.set(1, 1, 1);
    _tmpMesh.updateMatrix();
    const matrixWorld = _tmpMesh.matrix.clone();
    registerCollider(geo, matrixWorld);
    _queueMerge(geo, matrixWorld, mat, castsShadow, true);
    return { position: _tmpMesh.position.clone(), rotation: _tmpMesh.rotation.clone() };
  }

  const MAP_SIZE = 400;
  const terrainGeo = new THREE.PlaneGeometry(MAP_SIZE, MAP_SIZE, 96, 96);
  terrainGeo.rotateX(-Math.PI / 2);
  const posAttr = terrainGeo.attributes.position;
  for (let i = 0; i < posAttr.count; i++) {
    const x = posAttr.getX(i);
    const z = posAttr.getZ(i);
    posAttr.setY(i, getGroundHeight(x, z));
  }
  terrainGeo.computeVertexNormals();
  const terrain = new THREE.Mesh(terrainGeo, matGround);
  terrain.receiveShadow = true;
  scene.add(terrain);
  worldMeshes.push(terrain);

  function buildRockCluster(x, z, count = 6, scale = 1.0) {
    for (let i = 0; i < count; i++) {
      const rx = x + (Math.random() - 0.5) * 12 * scale;
      const rz = z + (Math.random() - 0.5) * 12 * scale;
      const gy = getGroundHeight(rx, rz);
      const s = (3.0 + Math.random() * 6.0) * scale;
      const geo = new THREE.DodecahedronGeometry(s, 1);
      const sx = 1 + Math.random() * 0.5;
      const sy = 0.7 + Math.random() * 0.6;
      const sz = 1 + Math.random() * 0.5;
      _tmpMesh.position.set(rx, gy + s * 0.5 * sy, rz);
      _tmpMesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
      _tmpMesh.scale.set(sx, sy, sz);
      _tmpMesh.updateMatrix();
      const matrixWorld = _tmpMesh.matrix.clone();
      const scaledGeo = geo.clone();
      scaledGeo.applyMatrix4(new THREE.Matrix4().makeScale(sx, sy, sz));
      registerCollider(scaledGeo, new THREE.Matrix4().makeTranslation(rx, gy + s * 0.5 * sy, rz));
      _queueMerge(geo, matrixWorld, matRock, false, true);
    }
  }
  for (let a = 0; a < Math.PI * 2; a += 0.18) {
    const dist = 130 + Math.sin(a * 5) * 25 + Math.random() * 20;
    buildRockCluster(Math.cos(a) * dist, Math.sin(a) * dist, 5, 1.8);
  }
  buildRockCluster(-65, -65, 8, 1.3);
  buildRockCluster(75, -55, 7, 1.4);
  buildRockCluster(-80, 55, 8, 1.5);
  buildRockCluster(65, 80, 8, 1.4);

  function buildCentralPlaza() {
    const cx = 0, cz = 0;
    const gy = getGroundHeight(cx, cz);
    for (let i = 0; i < 8; i++) {
      const ang = (i / 8) * Math.PI * 2;
      const bx = cx + Math.cos(ang) * 9;
      const bz = cz + Math.sin(ang) * 9;
      const bgy = getGroundHeight(bx, bz);
      createBox(4, 1.8, 1.2, bx, bgy + 0.9, bz, matConcrete, ang);
    }
    createBox(3.5, 8.0, 3.5, cx, gy + 4.0, cz, matConcrete);
    createBox(2.8, 4.0, 2.8, cx, gy + 10.0, cz, matBrick, 0.2, 0.1);
    createBox(4.5, 1.8, 9, cx + 8, gy + 0.9, cz - 6, matMetalRusted, 0.75);
    createBox(3.8, 1.4, 4, cx + 8, gy + 2.3, cz - 6, matMetalRusted, 0.75);
    for (let a = 0; a < Math.PI * 2; a += Math.PI / 3) {
      const sx = cx + Math.cos(a) * 18;
      const sz = cz + Math.sin(a) * 18;
      const sgy = getGroundHeight(sx, sz);
      createBox(6, 1.6, 1.4, sx, sgy + 0.8, sz, matSandbag, a + 1.57);
    }
    for (let k = 0; k < 12; k++) {
      const rx = cx + (Math.random() - 0.5) * 30;
      const rz = cz + (Math.random() - 0.5) * 30;
      const rgy = getGroundHeight(rx, rz);
      createBox(2.5 + Math.random() * 2, 0.6, 2.0, rx, rgy + 0.3, rz, matConcrete, Math.random() * Math.PI, 0.15);
    }
  }
  buildCentralPlaza();

  function buildCrumblingWall(x, z, length, height, rotY) {
    const segments = Math.floor(length / 3);
    for (let i = 0; i < segments; i++) {
      const segLen = 2.8 + Math.random() * 0.5;
      const segH = Math.max(1.2, height * (0.35 + Math.random() * 0.65));
      const offset = (i - segments / 2) * 3;
      const wx = x + Math.cos(rotY) * offset;
      const wz = z + Math.sin(rotY) * offset;
      const wgy = getGroundHeight(wx, wz);
      createBox(segLen, segH, 0.9, wx, wgy + segH / 2, wz, matBrick, rotY + (Math.random() - 0.5) * 0.1);
      if (Math.random() > 0.35) {
        createBox(1.2, 0.5, 1.2, wx + (Math.random() - 0.5) * 2.5, wgy + 0.25, wz + (Math.random() - 0.5) * 2.5, matConcrete, Math.random());
      }
    }
  }
  buildCrumblingWall(-30, -25, 26, 4.5, 0.3);
  buildCrumblingWall(35, -30, 24, 5.0, 1.3);
  buildCrumblingWall(-40, 35, 30, 4.2, -0.5);
  buildCrumblingWall(25, 45, 28, 4.8, 0.9);
  buildCrumblingWall(-100, -80, 35, 5.0, 0.8);
  buildCrumblingWall(110, -90, 38, 5.5, -0.4);
  buildCrumblingWall(-105, 95, 36, 4.8, 1.2);
  buildCrumblingWall(100, 105, 40, 5.2, 0.2);

  function buildRuinedHQ(x, z) {
    const wH = 6.0;
    const gy = getGroundHeight(x, z);
    createBox(26, wH, 0.9, x, gy + wH / 2, z - 13, matConcrete);
    createBox(0.9, wH, 26, x - 13, gy + wH / 2, z, matConcrete);
    createBox(16, wH, 0.9, x + 5, gy + wH / 2, z + 13, matConcrete);
    createBox(26, 0.6, 26, x, gy + wH, z, matConcrete);
    for (let i = 0; i < 14; i++) {
      const sx = x - 9 + (i * 0.75);
      const sz = z - 7;
      const sgy = getGroundHeight(sx, sz);
      createBox(3.8, 0.4, 1.2, sx, sgy + (i * 0.42) + 0.2, sz, matMetalRusted);
    }
    createBox(24, 0.5, 4.5, x + 18, gy + wH, z + 4, matMetalRusted, 0.2);
    createBox(0.4, 1.2, 24, x + 28, gy + wH + 0.6, z + 4, matMetalRusted, 0.2);
  }
  buildRuinedHQ(55, -55);
  buildRuinedHQ(-60, 55);

  function buildWatchtower(x, z) {
    const h = 20;
    const gy = getGroundHeight(x, z);
    createBox(1.2, h, 1.2, x - 4, gy + h / 2, z - 4, matMetalRusted);
    createBox(1.2, h, 1.2, x + 4, gy + h / 2, z - 4, matMetalRusted);
    createBox(1.2, h, 1.2, x - 4, gy + h / 2, z + 4, matMetalRusted);
    createBox(1.2, h, 1.2, x + 4, gy + h / 2, z + 4, matMetalRusted);
    createBox(10, 0.6, 10, x, gy + h, z, matConcrete);
    createBox(10, 1.4, 0.4, x, gy + h + 0.7, z - 4.8, matMetalRusted);
    createBox(10, 1.4, 0.4, x, gy + h + 0.7, z + 4.8, matMetalRusted);
    const steps = 24;
    for (let i = 0; i < steps; i++) {
      const stepY = (i / steps) * h;
      const angle = (i / steps) * Math.PI * 3.5;
      const sx = x + Math.cos(angle) * 3.6;
      const sz = z + Math.sin(angle) * 3.6;
      createBox(1.8, 0.3, 1.8, sx, gy + stepY, sz, matMetalRusted, -angle);
    }
  }
  buildWatchtower(95, 95);
  buildWatchtower(-95, -95);

  function populateMapClutter() {
    for (let r = 80; r <= 140; r += 20) {
      for (let a = 0; a < Math.PI * 2; a += 0.35) {
        const rx = Math.cos(a) * r + (Math.random() - 0.5) * 8;
        const rz = Math.sin(a) * r + (Math.random() - 0.5) * 8;
        const rgy = getGroundHeight(rx, rz);
        const type = Math.random();
        if (type < 0.4) {
          createBox(4.5, 2.0, 1.4, rx, rgy + 1.0, rz, matConcrete, a + 1.57, 0, 0, false);
        } else if (type < 0.75) {
          createBox(5.0, 1.6, 1.4, rx, rgy + 0.8, rz, matSandbag, a, 0, 0, false);
        } else {
          createBox(2.2, 2.2, 2.2, rx, rgy + 1.1, rz, matMetalRusted, Math.random(), 0, 0, false);
        }
      }
    }
    for (let i = 0; i < 90; i++) {
      const ang = Math.random() * Math.PI * 2;
      const dist = 22 + Math.random() * 60;
      const rx = Math.cos(ang) * dist;
      const rz = Math.sin(ang) * dist;
      const rgy = getGroundHeight(rx, rz);
      const type = Math.random();
      if (type < 0.35) {
        createBox(4.2, 2.0, 1.3, rx, rgy + 1.0, rz, matConcrete, Math.random() * Math.PI, 0, 0, false);
      } else if (type < 0.7) {
        createBox(6.0, 0.8, 3.2, rx, rgy + 0.4, rz, matConcrete, Math.random() * Math.PI, 0.2, 0, false);
      } else {
        createBox(3.8, 1.6, 1.4, rx, rgy + 0.8, rz, matSandbag, Math.random() * Math.PI, 0, 0, false);
      }
    }
  }
  populateMapClutter();

  const lampStep = IS_MOBILE ? 96 : 48;
  for (let i = -190; i <= 190; i += lampStep) {
    const lamp = new THREE.PointLight(i % 96 ? 0x79dfff : 0xffa45f, 2.0, 26, 2);
    lamp.position.set(i, 10, -195);
    scene.add(lamp);
  }

  flushStaticMerges();

  const playerSpawn = findFreeSpot(colliders, 0, 25);
  const pickupSpawns = [];
  const WEAPON_COUNT = 21;
  for (let i = 0; i < WEAPON_COUNT; i++) {
    const p = findFreeSpot(colliders, 35, 165);
    pickupSpawns.push({ index: i, pos: new THREE.Vector3(p.x, p.y, p.z) });
  }
  const enemySpawns = [];
  const enemyCount = 30;
  for (let i = 0; i < enemyCount; i++) {
    const p = findFreeSpot(colliders, 25, 150);
    enemySpawns.push([p.x, p.y, p.z]);
  }

  return { colliders, worldMeshes, pickupSpawns, enemySpawns, playerSpawn };
}

class Player{
 constructor(camera,input,colliders){this.camera=camera;this.input=input;this.colliders=colliders;const gy=getGroundHeight(0,0);this.position=new THREE.Vector3(0,gy+1.72,0);this.velocity=new THREE.Vector3();this.yaw=0;this.pitch=0;this.radius=.38;this.height=1.72;this.grounded=true;this.health=100;this.armor=50;this.recoilPitch=0;this.recoilYaw=0;camera.position.copy(this.position);}
 addRecoil(p,y){this.recoilPitch+=p;this.recoilYaw+=y}

function raySphereDist(ox,oy,oz,dx,dy,dz,cx,cy,cz,r){

}
function approxBoxNormal(box,point){

 if(nx>=ny&&nx>=nz)return new THREE.Vector3(Math.sign(point.x-cx)||1,0,0);

}

   const up=new THREE.Vector3(0,1,0);

   else if(mainHitKind==='wall'&&mainHitPoint)this.extras.spawnWallHitImpact(mainHitPoint,mainNormal);

}

class GrenadeSystem{
 constructor(scene,camera,player,audio,ui,extras,colliders){
  this.scene=scene;this.camera=camera;this.player=player;this.audio=audio;this.ui=ui;this.extras=extras;this.colliders=colliders;
  this.count=3;this.cooldown=0;this.active=[];

  if(this.count<=0||this.cooldown>0)return;
  this.count--;this.cooldown=.6;this.ui.grenadeCount(this.count);
  const dir=new THREE.Vector3();this.camera.getWorldDirection(dir);
  const pos=this.camera.position.clone().addScaledVector(dir,.6);
  const vel=dir.clone().multiplyScalar(20).add(new THREE.Vector3(0,5,0));
  const mesh=new THREE.Mesh(this.geo,this.mat);mesh.position.copy(pos);mesh.castShadow=true;this.scene.add(mesh);

  const p=g.mesh.position.clone();
  this.scene.remove(g.mesh);
  this.audio.noise(.35,.4,900);this.audio.tone(70,.3,'sawtooth',.2);
  const light=new THREE.PointLight(0xffaa55,18,16,2);light.position.copy(p);this.scene.add(light);
  setTimeout(()=>this.scene.remove(light),120);
  if(this.extras)this.extras.spawnWallHitImpact(p,new THREE.Vector3(0,1,0));
  for(const e of enemies){
   if(e.dead)continue;
   const d=e.mesh.position.distanceTo(p);
   if(d<9){const dmg=Math.max(0,1-d/9)*110;e.hit(dmg);}
  }
  const pd=this.player.position.distanceTo(p);
  if(pd<7){this.player.damage(Math.max(0,1-pd/7)*55);this.ui.damage();}
 }
 update(dt,enemies){
  if(this.cooldown>0)this.cooldown-=dt;
  for(let i=this.active.length-1;i>=0;i--){
   const g=this.active[i];
   g.fuse-=dt;g.vel.y-=18*dt;
   g.mesh.position.addScaledVector(g.vel,dt);
   const groundY=getGroundHeight(g.mesh.position.x,g.mesh.position.z);
   if(g.mesh.position.y<=groundY+.09){g.mesh.position.y=groundY+.09;g.vel.y*=-.35;g.vel.x*=.6;g.vel.z*=.6;}
   if(g.fuse<=0){this.explode(g,enemies);this.active.splice(i,1);}
  }

  rifleGroup.add(gunSlide);

  const scopeTube=new THREE.Mesh(g.scopeTube,m.dark);scopeTube.rotation.x=Math.PI/2;scopeTube.position.set(0,.08,.02);
  const scopeLens=new THREE.Mesh(g.scopeLens,m.lens);scopeLens.position.set(0,.08,-.081);scopeLens.rotation.y=Math.PI;

     root.rotation.set(0,0,0);

     root.rotation.set(0,0,0);
     root.position.set(0,0,0);

   rArm.rotation.set(-Math.PI/2,-.1,.15);rArm.position.set(-.24,.18,0);
   rifleGroup.position.set(.02,-.52,.08);rifleGroup.rotation.set(Math.PI/2,.1,-.15);

     rArm.rotation.set(-.6,-.3,.15);rArm.position.set(-.24,.18,0);
     lArm.rotation.set(-.7,.5,-.2);lArm.position.set(.24,.18,0);
     rifleGroup.position.set(0,-.45,.15);rifleGroup.rotation.set(-.2,0,0);

    this.matchStats.lastKillTime=now;
    this.matchStats.kills++;

    const streakNames={2:'DOUBLE KILL',3:'TRIPLE KILL',4:'MULTI KILL',5:'RAMPAGE'};
    if(streakNames[this.matchStats.streakCount])this.ui.streak(streakNames[this.matchStats.streakCount]);
    else if(this.matchStats.streakCount>5)this.ui.streak(this.matchStats.streakCount+' KILL STREAK');
   }

 hasLOS(){
  const from=this.mesh.position.clone().add(new THREE.Vector3(0,1.5,0)),to=this.player.position.clone();
  const dir=to.clone().sub(from),dist=dir.length();
  if(!Enemy._ray){Enemy._ray=new THREE.Ray();Enemy._vec=new THREE.Vector3();}
  const ray=Enemy._ray,tmp=Enemy._vec;

 update(dt){
  if(this.dead){
   const groundY = getGroundHeight(this.mesh.position.x, this.mesh.position.z);
   this.mesh.position.y = groundY;
   this.model.update(dt);
   this.deadTimer += dt;
   if(this.deadTimer > 5.0 && this.mesh.parent) {
    this.scene.remove(this.mesh);
   }
   return;
  }
  const groundY=getGroundHeight(this.mesh.position.x,this.mesh.position.z);
  this.mesh.position.y=groundY;
  const toPlayer=this.player.position.clone().sub(this.mesh.position);toPlayer.y=0;
  const d=toPlayer.length();
  this._losTimer-=dt;if(this._losTimer<=0){this._losTimer=.15;this._losCached=d<32?this.hasLOS():false;}
  const los=this._losCached;

  const isRusher=this.role==='rusher';
  const engageDist=isRusher?26:40;
  const holdDist=isRusher?8:18;
  const moveSpeed=isRusher?2.1:1.1;
  if(los&&d<engageDist){
   const lookTarget=this.player.position.clone();lookTarget.y=this.mesh.position.y;
   this.mesh.lookAt(lookTarget);

    animState='run';

    if(!this.colliders.some(c=>c.intersectsBox(box)))this.mesh.position.copy(next);
   }else{
    animState=this.shootTimer>0?'shoot':'idle';
   }
   if(this.cool<=0&&d<engageDist){
    this.cool=isRusher?0.7+Math.random()*0.8:1.1+Math.random()*1.4;this.shootTimer=.35;
    const playerSpeed=Math.min(1,this.player.velocity.length()/8);
    let accuracy=THREE.MathUtils.clamp(.56-d*.014-playerSpeed*.18,.16,.48);
    if(this.role==='marksman')accuracy=Math.min(accuracy+0.12,0.72);
    if(Math.random()<accuracy){
     this.player.damage(5+Math.random()*5);this.ui.damage();
     const ddx=this.mesh.position.x-this.player.position.x,ddz=this.mesh.position.z-this.player.position.z;
     const yaw=this.player.yaw,fx=-Math.sin(yaw),fz=-Math.cos(yaw),rx=Math.cos(yaw),rz=-Math.sin(yaw);
     const fComp=ddx*fx+ddz*fz,rComp=ddx*rx+ddz*rz;
     this.ui.damageDir(Math.atan2(rComp,fComp)*180/Math.PI);
    }
    else this.ui.toast('INCOMING FIRE');
   }
  }else{
   animState='walk';
   this.phase+=dt;
   const step=new THREE.Vector3(Math.sin(this.phase),0,Math.cos(this.phase*.83)).multiplyScalar(dt*.28);
   const next=this.mesh.position.clone().add(step);next.y=getGroundHeight(next.x,next.z);
   const box=new THREE.Box3().setFromCenterAndSize(next.clone().add(new THREE.Vector3(0,.9,0)),new THREE.Vector3(.8,1.8,.8));
   if(!this.colliders.some(c=>c.intersectsBox(box))){
    const lookTarget=next.clone();lookTarget.y=this.mesh.position.y;
    this.mesh.lookAt(lookTarget);
    this.mesh.position.copy(next);
   }
  }
  if(this.shootTimer>0)animState='shoot';
  this.model.play(animState);
  this.model.update(dt);
 }
}

  this.rocketGeo = new THREE.ConeGeometry(0.08, 0.45, 8);
  this.rocketGeo.rotateX(-Math.PI / 2);
  this.rocketMat = new THREE.MeshStandardMaterial({ color: 0x2b2d42, metalness: 0.6, roughness: 0.4 });
  this.medkitBodyMat = new THREE.MeshStandardMaterial({ color: 0xed2939, roughness: 0.3 });
  this.medkitCrossMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  this.wallImpactTex = this._createWallImpactTexture();
  this.bloodImpactTex = this._createBloodImpactTexture();
  this.decalGeo = new THREE.PlaneGeometry(0.45, 0.45);
  this.particleGeo = new THREE.BoxGeometry(0.035, 0.035, 0.035);
  this.wallParticleMat = new THREE.MeshBasicMaterial({ color: 0xd1d5db });
  this.bloodParticleMat = new THREE.MeshBasicMaterial({ color: 0xb91c1c });
 }
 _createWallImpactTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 128; canvas.height = 128;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#111111';
  ctx.beginPath(); ctx.arc(64, 64, 22, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#444444'; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.arc(64, 64, 38, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = '#222222'; ctx.lineWidth = 3;
  for (let i = 0; i < 8; i++) {
   const ang = (i / 8) * Math.PI * 2;
   ctx.beginPath(); ctx.moveTo(64, 64);
   ctx.lineTo(64 + Math.cos(ang) * 58, 64 + Math.sin(ang) * 58);
   ctx.stroke();
  }
  const tex = new THREE.CanvasTexture(canvas);
  return tex;
 }
 _createBloodImpactTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 128; canvas.height = 128;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#7a0000';
  ctx.beginPath(); ctx.arc(64, 64, 26, 0, Math.PI * 2); ctx.fill();
  for (let i = 0; i < 18; i++) {
   const rx = 64 + (Math.random() - 0.5) * 85;
   const ry = 64 + (Math.random() - 0.5) * 85;
   const rad = 2 + Math.random() * 7;
   ctx.beginPath(); ctx.arc(rx, ry, rad, 0, Math.PI * 2); ctx.fill();
  }
  const tex = new THREE.CanvasTexture(canvas);
  return tex;
 }
 spawnShell(position, velocity) {
  if (this.shells.length >= 60) { const old = this.shells.shift(); this.scene.remove(old.mesh); }
  const mesh = new THREE.Mesh(this.shellGeo, this.shellMat);
  mesh.position.copy(position);
  mesh.castShadow = false;
  this.scene.add(mesh);
  this.shells.push({
   mesh,
   vel: velocity.clone().add(new THREE.Vector3((Math.random() - 0.5) * 0.4, 1.8 + Math.random() * 0.8, (Math.random() - 0.5) * 0.4)),
   rotVel: new THREE.Vector3(Math.random() * 35, Math.random() * 35, Math.random() * 35),
   life: 4.0
  });
 }
 spawnProjectile(position, velocity, isRocket = false) {
  if (this.projectiles.length >= 50) { const old = this.projectiles.shift(); this.scene.remove(old.mesh); }
  const geo = isRocket ? this.rocketGeo : this.bulletGeo;
  const mat = isRocket ? this.rocketMat : this.bulletMat;
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(position);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), velocity.clone().normalize());
  this.scene.add(mesh);
  this.projectiles.push({ mesh, vel: velocity, isRocket, life: 3.5 });
 }
 spawnMedkit(x, z, groundY = 0) {
  const group = new THREE.Group();
  const box = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.45, 0.45), this.medkitBodyMat);
  box.castShadow = true;
  group.add(box);
  const crossV = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.3, 0.47), this.medkitCrossMat);
  const crossH = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.12, 0.47), this.medkitCrossMat);
  group.add(crossV, crossH);
  group.position.set(x, groundY + 0.5, z);
  this.scene.add(group);
  this.medkits.push({ group, baseY: groundY + 0.5, rotSpeed: 1.4 });
 }
 spawnWallHitImpact(point, normal) {
  this._spawnDecalAndParticles(point, normal, this.wallImpactTex, 0xd1d5db, true);
 }
 spawnEnemyHitImpact(point, normal) {
  this._spawnDecalAndParticles(point, normal, this.bloodImpactTex, 0xb91c1c, false);
 }
 _spawnDecalAndParticles(point, normal, decalTex, particleColor, isWall) {
  if (this.impacts.length >= 24) {
   const old = this.impacts.shift();
   this.scene.remove(old.decal); this.scene.remove(old.particleGroup);
   old.decal.material.dispose();
  }
  const decalMat = new THREE.MeshBasicMaterial({
   map: decalTex, transparent: true, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -4
  });
  const decal = new THREE.Mesh(this.decalGeo, decalMat);
  decal.position.copy(point).add(normal.clone().multiplyScalar(0.01));
  decal.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), normal);
  this.scene.add(decal);
  const particleGroup = new THREE.Group();
  const pMat = isWall ? this.wallParticleMat : this.bloodParticleMat;
  const particles = [];
  for (let i = 0; i < 12; i++) {
   const p = new THREE.Mesh(this.particleGeo, pMat);
   p.position.copy(point);
   const pVel = normal.clone().add(new THREE.Vector3(
    (Math.random() - 0.5) * 1.8, (Math.random() - 0.5) * 1.8, (Math.random() - 0.5) * 1.8
   )).normalize().multiplyScalar(2.5 + Math.random() * 2.5);
   particleGroup.add(p);
   particles.push({ mesh: p, vel: pVel });
  }
  this.scene.add(particleGroup);
  this.impacts.push({ decal, particleGroup, particles, life: 3.5 });
 }
 update(delta) {
  const time = performance.now() * 0.001;
  for (let i = this.shells.length - 1; i >= 0; i--) {
   const s = this.shells[i];
   s.life -= delta;
   s.vel.y -= 12.0 * delta;
   s.mesh.position.addScaledVector(s.vel, delta);
   s.mesh.rotation.x += s.rotVel.x * delta;
   s.mesh.rotation.y += s.rotVel.y * delta;
   s.mesh.rotation.z += s.rotVel.z * delta;
   
   const groundY = getGroundHeight(s.mesh.position.x, s.mesh.position.z);
   if (s.mesh.position.y <= groundY + 0.02) {
    s.mesh.position.y = groundY + 0.02;
    s.vel.y *= -0.3;
    s.vel.x *= 0.4;
    s.vel.z *= 0.4;
    s.rotVel.multiplyScalar(0.3);
   }
   
   if (s.life <= 0) { this.scene.remove(s.mesh); this.shells.splice(i, 1); }
  }
  for (let i = this.projectiles.length - 1; i >= 0; i--) {
   const p = this.projectiles[i];
   p.life -= delta;
   p.mesh.position.addScaledVector(p.vel, delta);
   if (p.life <= 0) { this.scene.remove(p.mesh); this.projectiles.splice(i, 1); }
  }
  for (let i = 0; i < this.medkits.length; i++) {
   const m = this.medkits[i];
   m.group.rotation.y += m.rotSpeed * delta;
   m.group.position.y = m.baseY + Math.sin(time * 3.5) * 0.08;
  }
  for (let i = this.impacts.length - 1; i >= 0; i--) {
   const imp = this.impacts[i];
   imp.life -= delta;
   for (let j = 0; j < imp.particles.length; j++) {
    const p = imp.particles[j];
    p.vel.y -= 4.0 * delta;
    p.mesh.position.addScaledVector(p.vel, delta);
   }
   if (imp.life < 1.0) imp.decal.material.opacity = imp.life;
   if (imp.life <= 0) {
    this.scene.remove(imp.decal);
    this.scene.remove(imp.particleGroup);
    imp.decal.material.dispose();
    this.impacts.splice(i, 1);
   }
  }
 }
}

 const cv=document.createElement('canvas');cv.width=256;cv.height=64;const cx=cv.getContext('2d');cx.fillStyle='rgba(4,12,16,.82)';cx.fillRect(0,0,256,64);cx.fillStyle='#9df3ff';cx.font='bold 26px system-ui';cx.textAlign='center';cx.fillText(this.name,128,41);const tex=new THREE.CanvasTexture(cv);const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false}));sp.position.set(0,2.08,0);sp.scale.set(1.45,.36,1);sp.userData.playerTag=true;g.add(sp);g.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});return g;}

class PeerMultiplayer{

class RendererSystem{
 constructor(canvas,scene,camera){this.renderer=new THREE.WebGLRenderer({canvas,antialias:!IS_MOBILE,powerPreference:'high-performance'});this.renderer.setPixelRatio(IS_MOBILE?Math.min(devicePixelRatio,1):Math.min(devicePixelRatio,1.1));this.renderer.setSize(innerWidth,innerHeight);this.renderer.shadowMap.enabled=true;this.renderer.shadowMap.type=IS_MOBILE?THREE.BasicShadowMap:THREE.PCFShadowMap;this.renderer.toneMapping=THREE.ACESFilmicToneMapping;this.renderer.toneMappingExposure=1.15;this.composer=new EffectComposer(this.renderer);this.composer.addPass(new RenderPass(scene,camera));if(!IS_MOBILE){this.bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth/2,innerHeight/2),.45,.55,.85);this.composer.addPass(this.bloom);}this.composer.addPass(new OutputPass());this.canvas=canvas;this.qualityLevel=0;addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();this.renderer.setSize(innerWidth,innerHeight);this.composer.setSize(innerWidth,innerHeight)});}
 render(dt){this.composer.render(dt)}
 downgrade(){
  this.qualityLevel++;
  if(this.qualityLevel===1){
   if(this.bloom){this.composer.removePass(this.bloom);this.bloom=null;}
   this.renderer.shadowMap.type=THREE.BasicShadowMap;
   this.renderer.shadowMap.needsUpdate=true;
  }else if(this.qualityLevel===2){
   this.renderer.shadowMap.enabled=false;
   this.renderer.setPixelRatio(Math.min(devicePixelRatio,0.85));
   this.renderer.setSize(innerWidth,innerHeight);
   this.composer.setSize(innerWidth,innerHeight);
  }else if(this.qualityLevel>=3){
   this.renderer.setPixelRatio(Math.min(devicePixelRatio,0.65));
   this.renderer.setSize(innerWidth,innerHeight);
   this.composer.setSize(innerWidth,innerHeight);
  }
  return this.qualityLevel;
 }
}

const canvas=document.querySelector('#game'),root=document.querySelector('#ui-root');const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.05,700);const world=withSeed(MAP_SEED,()=>buildArena(scene)),colliders=world.colliders;const ui=new UI(root),input=new Input(canvas),audio=new AudioSystem(),renderer=new RendererSystem(canvas,scene,camera),player=new Player(camera,input,colliders),extras=new FPSExtrasPack(scene);const matchStats={kills:0,shotsFired:0,shotsHit:0,time:0,lastKillTime:-99,streakCount:0};const net=new PeerMultiplayer(scene,ui,player);window.__NET=net;const weapon=new Weapon(camera,scene,audio,ui,player,extras,world.worldMeshes,colliders,matchStats);const grenades=new GrenadeSystem(scene,camera,player,audio,ui,extras,colliders);const armory=new ArmoryUI(ui,weapon,input);ui.buildLoadout(weapon);const touch=IS_MOBILE?new TouchControls(input):null;player.position.set(world.playerSpawn.x,world.playerSpawn.y+player.height,world.playerSpawn.z);camera.position.copy(player.position);const enemies=world.enemySpawns.map(p=>new Enemy(scene,new THREE.Vector3(...p),player,ui,colliders,matchStats)),pickups=world.pickupSpawns.map(p=>new WeaponPickup(scene,p));enemies.forEach((e,i)=>e.netId='bot-'+i);net.onBotHit=(id,damage,shooter)=>{const e=enemies.find(x=>x.netId===id);if(!e||e.dead)return;e._netApplying=true;e.hit(damage);e._netApplying=false;if(e.dead&&shooter&&shooter!==net.peer?.id){const c=net.gameConns.get(shooter);if(c?.open)c.send({t:'kill_confirm'});}};net.onBotSnapshot=bots=>{for(const b of bots||[]){const e=enemies.find(x=>x.netId===b.id);if(!e)continue;e.mesh.position.set(b.x,b.y,b.z);e.mesh.rotation.y=b.yaw;e.dead=b.dead;e.health=b.health;e.mesh.visible=!b.gone;if(e.dead)e.model.play('die');}};const totalEnemies=enemies.length;for(let i=0;i<6;i++){const s=findFreeSpot(colliders,20,150);extras.spawnMedkit(s.x,s.z,s.y);}let nearPickup=null,running=false,last=performance.now(),fpsT=0,frames=0,lowFpsStreak=0,downgradeCooldown=0;

net.onMatch=(m)=>{
 const humanCount=Math.max(1,m.members?.length||1),botTarget=Math.max(0,MP_TOTAL_PLAYERS-humanCount);
 for(let i=enemies.length-1;i>=botTarget;i--){const e=enemies[i];scene.remove(e.mesh);enemies.splice(i,1);}
 ui.updateEnemyCount(enemies.filter(e=>!e.dead).length+Math.max(0,humanCount-1));

};
if(IS_MOBILE){document.body.classList.add('is-mobile');const hint=ui.q('#deploy small');if(hint)hint.textContent='TAP TO DEPLOY';ui.q('.subtitle').textContent='Deploy into a shattered warzone sector. Use the left stick to move, drag anywhere to look, and the arsenal is scattered across the ruined plaza, watchtowers and outer rockline.';[...ui.q('.panel').querySelectorAll('.statline')].forEach(el=>el.remove());}
ui.q('#deploy').onclick=()=>{if(!net.ready){net.setStatus('PRESS FIND MATCH FIRST',false,true);return;}weapon.saveProgress(weapon.index);audio.ensure();running=true;ui.start();touch?.show(true);if(!IS_MOBILE&&canvas.requestPointerLock){try{canvas.requestPointerLock()}catch(e){}}requestAnimationFrame(loop)};ui.q('#resume').onclick=()=>{ui.pause.classList.add('hidden');running=true;if(!IS_MOBILE)canvas.requestPointerLock();touch?.show(true)};ui.q('#restart').onclick=()=>location.reload();ui.q('#playAgain').onclick=()=>location.reload();input.onFire=v=>weapon.setTrigger(v);input.onReload=()=>weapon.reload();input.onHolster=()=>weapon.toggleHolster();input.onWeapon=i=>weapon.switchTo(i);input.onArmory=()=>{running=false;armory.toggle();if(!armory.open)running=true;touch?.show(!armory.open)};input.onInteract=()=>{if(nearPickup&&!nearPickup.taken){weapon.unlock(nearPickup.index);ui.buildLoadout(weapon);nearPickup.remove();nearPickup=null;ui.prompt(null,false)}};input.onPause=()=>{if(ui.menu.classList.contains('hidden')&&ui.victory.classList.contains('hidden')){running=!running;ui.pause.classList.toggle('hidden',running);if(!running)ui.finalStats('#pauseStats',matchStats);touch?.show(running)}};input.onADS=(v)=>{weapon.toggleADS(v);ui.setScope(v);};input.onGrenade=()=>grenades.throw_();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.033,(now-last)/1000);last=now;if(running){player.update(dt);net.update(dt);const combatants=enemies.concat(net.combatants());weapon.update(dt,combatants);grenades.update(dt,enemies);if(net.isHost){for(const e of enemies)e.update(dt);if(performance.now()-net._lastBotBroadcast>100){net._lastBotBroadcast=performance.now();const bots=enemies.map(e=>({id:e.netId,x:e.mesh.position.x,y:e.mesh.position.y,z:e.mesh.position.z,yaw:e.mesh.rotation.y,health:e.health,dead:e.dead,gone:!e.mesh.parent}));for(const c of net.gameConns.values())if(c.open)c.send({t:'botSnapshot',bots});}}const alive=enemies.filter(e=>!e.dead);const aliveHumans=net.combatants().filter(e=>!e.dead).length;ui.updateEnemyCount(alive.length+aliveHumans);matchStats.time+=dt;ui.updateMatch(matchStats.time,matchStats.kills,totalEnemies);ui.updateCompass(((-player.yaw*180/Math.PI)%360+360)%360);ui.updateMinimap(player,enemies,pickups,extras.medkits);extras.update(dt);for(let i=extras.medkits.length-1;i>=0;i--){const mk=extras.medkits[i];if(player.health<100&&mk.group.position.distanceTo(player.position)<2.2){player.health=Math.min(100,player.health+35);scene.remove(mk.group);extras.medkits.splice(i,1);ui.toast('MEDKIT RECOVERED // +35 VITALS');}}nearPickup=null;let best=Infinity;for(const p of pickups)if(!p.taken&&p.update(dt,player)){const d=p.mesh.position.distanceTo(player.position);if(d<best){best=d;nearPickup=p}}ui.prompt(nearPickup?WEAPONS[nearPickup.index]:null,!!nearPickup);touch?.setInteractVisible(!!nearPickup);ui.updateVitals(player);if(player.health<=0){running=false;ui.pause.classList.remove('hidden');ui.pause.querySelector('h1').textContent='Operator down';ui.finalStats('#pauseStats',matchStats);touch?.show(false)}if(weapon.unlocked.size===WEAPONS.length)ui.toast('FULL ARSENAL RECOVERED // 21 OF 21');if(alive.length===0&&aliveHumans===0&&!weapon.holstered){running=false;ui.finalStats('#victoryStats',matchStats);ui.showVictory();touch?.show(false);}}renderer.render(dt);fpsT+=dt;frames++;if(fpsT>.5){const fps=frames/fpsT;ui.setFPS(Math.round(fps));fpsT=frames=0;if(downgradeCooldown>0)downgradeCooldown--;if(running){if(fps<24){lowFpsStreak++;if(lowFpsStreak>=4&&downgradeCooldown<=0&&renderer.qualityLevel<3){renderer.downgrade();downgradeCooldown=10;lowFpsStreak=0;}}else if(fps>32){lowFpsStreak=0;}}}}
requestAnimationFrame(loop);
